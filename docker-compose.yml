services:
  postgres:
    image: postgres:16-alpine
    container_name: itseasynow-recruiter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_recruiter
    ports:
      - "5433:5432"
    volumes:
      - recruiter_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_recruiter"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  recruiter_postgres_data:
